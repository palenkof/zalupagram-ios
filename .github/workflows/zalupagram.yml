name: Сборка ZalupaGram

on:
  workflow_dispatch:
    inputs:
      release:
        description: 'Выпустить релиз vX.Y.Z (иначе тестовая сборка build-N)'
        type: boolean
        default: false

concurrency:
  group: zalupagram-build
  cancel-in-progress: false

jobs:
  build:
    runs-on: xcode-27
    timeout-minutes: 360

    env:
      SOURCE_DIR: /Users/Shared/telegram-ios
      CONFIG_DIR: /Users/Shared/zg-config
      CODESIGNING_DIR: /Users/Shared/zg-codesigning
      OUTPUT_DIR: /Users/Shared/zg-out
      BAZEL_CACHE_DIR: /Users/Shared/zg-bazel-cache
      RELEASES_REPO: palenkof/zalupagram-ios-releases

    steps:
      - name: Free disk space
        run: |
          df -h /
          sudo rm -rf \
            /Applications/Xcode_27.app \
            /Applications/Xcode_27.2_Release_Candidate.app \
            "$HOME/Library/Android" \
            /usr/local/share/dotnet \
            "$HOME/.dotnet" || true
          xcrun simctl runtime delete all || true
          df -h /

      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      # Source paths end up in the binary and in the Bazel cache keys,
      # keep them the same on every build.
      - name: Move sources to a stable path
        run: |
          sudo mkdir -p /Users/Shared
          sudo chown "$USER" /Users/Shared
          mv "$GITHUB_WORKSPACE" "$SOURCE_DIR"
          mkdir -p "$GITHUB_WORKSPACE"

      - name: Select Xcode
        run: |
          XCODE_VERSION=$(python3 -c 'import json;print(json.load(open("'$SOURCE_DIR'/versions.json"))["xcode"])')
          sudo xcode-select -s "/Applications/Xcode_$XCODE_VERSION.app/Contents/Developer"
          xcodebuild -version

      - name: Read version
        run: |
          cd "$SOURCE_DIR"
          ZG_VERSION=$(python3 -c 'import json;print(json.load(open("zalupagram/version.json"))["version"])')
          ZG_BUNDLE_ID=$(python3 -c 'import json;print(json.load(open("zalupagram/version.json"))["bundle_id"])')
          echo "ZG_VERSION=$ZG_VERSION" >> "$GITHUB_ENV"
          echo "ZG_BUNDLE_ID=$ZG_BUNDLE_ID" >> "$GITHUB_ENV"
          echo "BUILD_NUMBER=$((100000 + GITHUB_RUN_NUMBER))" >> "$GITHUB_ENV"

      - name: Write configuration
        env:
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
          UPDATE_TOKEN: ${{ secrets.UPDATE_TOKEN }}
        run: |
          # Read-only token of the releases repo for the in-app updater,
          # zalupagram/ci/gen_sources.py masks it into the app.
          if [ -n "$UPDATE_TOKEN" ]; then
            printf '%s' "$UPDATE_TOKEN" > "$SOURCE_DIR/zalupagram/update_token.txt"
          else
            echo "Секрет UPDATE_TOKEN не задан, обновление внутри приложения работать не будет"
          fi
          if [ -z "$TELEGRAM_API_ID" ] || [ -z "$TELEGRAM_API_HASH" ]; then
            echo "Секреты TELEGRAM_API_ID и TELEGRAM_API_HASH не заданы"
            exit 1
          fi
          mkdir -p "$CONFIG_DIR"
          python3 - <<'EOF'
          import json, os
          config = {
              'bundle_id': os.environ['ZG_BUNDLE_ID'],
              'api_id': os.environ['TELEGRAM_API_ID'].strip(),
              'api_hash': os.environ['TELEGRAM_API_HASH'].strip(),
              # The team of the self-signed fake profiles, AltStore re-signs anyway.
              'team_id': 'C67CF9S4VU',
              'app_center_id': '0',
              'is_internal_build': 'false',
              'is_appstore_build': 'false',
              'appstore_id': '0',
              'app_specific_url_scheme': 'zalupagram',
              'premium_iap_product_id': '',
              'enable_siri': False,
              'enable_icloud': False,
          }
          with open(os.environ['CONFIG_DIR'] + '/configuration.json', 'w') as f:
              json.dump(config, f, indent=4)
          EOF

      - name: Prepare fake codesigning
        run: |
          cd "$SOURCE_DIR"
          python3 zalupagram/ci/make_fake_codesigning.py \
            --source build-system/fake-codesigning \
            --destination "$CODESIGNING_DIR" \
            --bundleId "$ZG_BUNDLE_ID"
          python3 build-system/Make/ImportCertificates.py --path "$CODESIGNING_DIR/certs"

      - name: Restore Bazel cache
        uses: actions/cache/restore@v4
        with:
          path: /Users/Shared/zg-bazel-cache
          key: bazel-${{ github.ref_name }}-${{ github.sha }}
          restore-keys: |
            bazel-${{ github.ref_name }}-
            bazel-

      - name: Build
        run: |
          cd "$SOURCE_DIR"
          python3 -u build-system/Make/Make.py \
            --overrideXcodeVersion \
            --cacheDir="$BAZEL_CACHE_DIR" \
            build \
            --continueOnError \
            --configurationPath="$CONFIG_DIR/configuration.json" \
            --codesigningInformationPath="$CODESIGNING_DIR" \
            --configuration=release_arm64 \
            --buildNumber="$BUILD_NUMBER" \
            --outputBuildArtifactsPath="$OUTPUT_DIR"
          df -h /

      - name: Save Bazel cache
        if: always() && !cancelled()
        uses: actions/cache/save@v4
        with:
          path: /Users/Shared/zg-bazel-cache
          key: bazel-${{ github.ref_name }}-${{ github.sha }}

      - name: Publish to the releases repo
        env:
          GH_TOKEN: ${{ secrets.RELEASES_TOKEN }}
          IS_RELEASE: ${{ inputs.release }}
        run: |
          cd "$OUTPUT_DIR"
          mv Telegram.ipa "ZalupaGram-$ZG_VERSION.ipa"
          if [ -f Telegram.DSYMs.zip ]; then
            mv Telegram.DSYMs.zip "ZalupaGram-$ZG_VERSION-dSYM.zip"
          fi
          shasum -a 256 "ZalupaGram-$ZG_VERSION.ipa" > "ZalupaGram-$ZG_VERSION.ipa.sha256"
          ls -la
          COMMIT=$(git -C "$SOURCE_DIR" rev-parse --short HEAD)
          if [ "$IS_RELEASE" = "true" ]; then
            TAG="v$ZG_VERSION"
            set -- --latest --title "ZalupaGram для iOS $ZG_VERSION" --notes "Сборка $BUILD_NUMBER, коммит $COMMIT."
          else
            TAG="build-$BUILD_NUMBER"
            set -- --prerelease --title "Тестовая сборка $ZG_VERSION ($BUILD_NUMBER)" --notes "Коммит $COMMIT."
          fi
          # GitHub sometimes answers 502: a half-made release of this run is
          # removed and the upload repeated.
          for attempt in 1 2 3 4; do
            if gh release create "$TAG" --repo "$RELEASES_REPO" "$@" ZalupaGram-*; then
              exit 0
            fi
            echo "Upload attempt $attempt failed, retrying"
            sleep 30
            gh release delete "$TAG" --repo "$RELEASES_REPO" --yes --cleanup-tag || true
          done
          exit 1
